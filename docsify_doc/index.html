<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reed 文档 / Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --sidebar-width: 250px;
    }
  </style>
</head>
<body>
  <div id="app">加载中……</div>
  <script>
    window.$docsify = {
      name: 'reed',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      loadCoverpage: true,
      coverpage: ['/', '/en/'],
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      fallbackLanguages: ['en'],
      search: {
        placeholder: '搜索 / Search',
        noData: '没有结果 / No results',
        depth: 3
      },
      pagination: {
        previousText: '上一页 / Previous',
        nextText: '下一页 / Next'
      },
      relativePath: true
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
</body>
</html>
