# =============================================================================
# gold/config/filters.conf — 硬过滤规范的唯一真源 (single source of truth)
# =============================================================================
# 本文件被 scripts/lib.sh source 进 shell，同时被 compare_tools.py / check_parity.py
# 以 KEY=VALUE 解析。所有键均用 ${VAR:-default} 形式，因此环境变量可覆盖：
#
#     SITE_MISS_MAX=0.2 HWE_MIN=0 bash scripts/run_all.sh
#
# 三个工具 (bcftools / vcftools / plink2) 各自把本规范翻译为自己的 CLI。
# 规范分两层：
#   * common 层：三个工具都能表达的过滤，用于三方一致性对拍；
#   * INFO 层：只有 bcftools 能表达的 INFO 硬过滤 (QD/FS/MQ/SOR)，只进 gold。
#
# ---- 输入画像 (Chr01-03 子集, 480,952 位点, 2026-10-04; 见 out/profile.md) ----
#   过 type+PASS+QUAL>=30 : 100.0%    (空操作)
#   过 位点缺失<=0.10     :  54.2%    (掩码后口径)
#   过 MAF>=0.05          :  97.1%    (空操作，输入已 MAF 0.05 过滤)
#   过 HWE>=1e-6          :   8.5%    (自交物种，不适用)
#   全部位点层累积        :   3.47%   (HWE 占主导)
# 结论：本数据真正有效的是「GQ/DP 基因型掩码 + 位点缺失 + (可选)更高 MAF」；
#   QUAL/PASS/双等位/样本缺失 均为空操作守卫；HWE 对自交物种默认关闭。
# =============================================================================

# ---- 输入 / 输出 -----------------------------------------------------------
# 默认输入：仓库上级目录的 clean.vcf.gz (348 样本 / 20 条 Chr / 331.5 万 SNP)。
# 用绝对路径或相对 gold/ 的路径均可。
INPUT="${INPUT:-}"
# 可选：只跑某个区间做烟测，例如 REGION=Chr01:1-2000000
REGION="${REGION:-}"

# ---- 样本级 ---------------------------------------------------------------
# 每样本缺失率上限；超过者剔除。样本保留名单由 run_all.sh 在**全量输入**上
# 统一计算一次，三个工具共享同一名单（避免 plink2 --mind 在小切片上误删样本）。
SAMPLE_MISS_MAX="${SAMPLE_MISS_MAX:-0.20}"

# ---- 变异类型 -------------------------------------------------------------
# 只保留双等位 SNP (ACGT)。本数据全为 SNP，此层为空操作，但保留以固定语义。
KEEP_BIALLELIC_SNPS="${KEEP_BIALLELIC_SNPS:-1}"

# ---- QUAL / FILTER --------------------------------------------------------
# ⚠ 实测(Chr01-03, 2026-10-04)：本输入 QUAL 最小 1201、p1=4443，故 QUAL>=30 是
#   **纯空操作**（GATK 侧已按 SNP_FILTER=QD<4||FS>50||MQ<40||SOR>3 过滤）。保留为语义下限。
MIN_QUAL="${MIN_QUAL:-30}"
# 只保留 FILTER==PASS。本输入全 PASS，此层为空操作，保留为语义守卫。
REQUIRE_PASS="${REQUIRE_PASS:-1}"

# ---- 基因型级：不达标者置为缺失 (./.) --------------------------------------
# 实测：DP<5 占基因型 2.0%，DP>100 占 0.12%，GQ<20 占 11.8% —— **本层真正有效**。
GT_DP_MIN="${GT_DP_MIN:-5}"
GT_DP_MAX="${GT_DP_MAX:-100}"
GT_GQ_MIN="${GT_GQ_MIN:-20}"

# ---- 位点级 ---------------------------------------------------------------
# 位点缺失率上限 (掩码后重算)。实测掩码后缺失 p50=0.089 / p75=0.175，
# 故 <=0.10 保留 54.2% —— **有效**。注意：输入原始缺失已<=0.2(miss 0.8 过滤)，
# 但 GQ/DP 掩码会新增缺失，故此处按掩码后口径过滤（与 vcftools/plink2 一致）。
SITE_MISS_MAX="${SITE_MISS_MAX:-0.10}"
# 次等位基因频率下限 (掩码后由基因型重算，不用陈旧的 INFO/AC)。
# ⚠ 实测：输入已按 MAF 0.05 过滤，MAF>=0.05 保留 97.1% —— 近似空操作(仅掩码后
#   频率漂移的位点被剔)。若要真正收紧标记集可提高，如 MAF_MIN=0.10。
MAF_MIN="${MAF_MIN:-0.05}"
# HWE 精确检验 p 值下限。
# ⚠⚠ 本数据为大豆(高度自交物种)，全基因组纯合子过量：实测(掩码前后一致)
#   HWE p<1e-6 的位点占 ~91.5%，HWE_MIN=1e-6 仅保留 8.5% —— **对自交物种不适用**。
#   故默认关闭(0)。若要开启全参数含 HWE：HWE_MIN=1e-6（代价见上）。
HWE_MIN="${HWE_MIN:-0}"

# ---- INFO 硬过滤 (仅 bcftools gold 层) ------------------------------------
# 对应 GATK SNP_FILTER = QD < 4.0 || FS > 50.0 || MQ < 40.0 || SOR > 3.0
INFO_QD_MIN="${INFO_QD_MIN:-4.0}"
INFO_FS_MAX="${INFO_FS_MAX:-50.0}"
INFO_MQ_MIN="${INFO_MQ_MIN:-40.0}"
INFO_SOR_MAX="${INFO_SOR_MAX:-3.0}"

# ---- 工具路径 -------------------------------------------------------------
BIOSOFT="${BIOSOFT:-$HOME/biosoft}"
BCFTOOLS="${BCFTOOLS:-$BIOSOFT/bcftools}"
VCFTOOLS="${VCFTOOLS:-$BIOSOFT/vcftools}"
PLINK2="${PLINK2:-$BIOSOFT/plink2}"
BGZIP="${BGZIP:-$BIOSOFT/htslib-1.23/bgzip}"
TABIX="${TABIX:-$BIOSOFT/htslib-1.23/tabix}"
# reed 二进制（cargo build --release 的产物）
REED="${REED:-/tmp/reed-target/release/reed}"
# bcftools 插件 (fill-tags 提供 MAF/HWE)。预编译 .so 在 bcftools_dir/plugins。
BCFTOOLS_PLUGINS="${BCFTOOLS_PLUGINS:-$BIOSOFT/bcftools_dir/plugins}"
export BCFTOOLS_PLUGINS

# ---- 线程 -----------------------------------------------------------------
THREADS="${THREADS:-8}"
