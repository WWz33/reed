# Development branches keep the full gates; main checks only the public source.
# Pull requests use the target branch to select the same boundary. Release tags
# are handled by release.yml, since the public tree omits development fixtures.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The published main tree intentionally excludes development docs, tests,
    # and gold fixtures. Keep this job limited to the source that is public.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build public source (release)
        run: cargo build --release --locked --workspace

  gates:
    # All non-main pushes and PRs targeting dev/non-main branches use the full
    # development gates. Main uses public-build above instead.
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
    runs-on: ubuntu-24.04
    steps:
      # semver-checks needs release tags: a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Stable is the default for every ordinary build, test, lint, and format
      # command in this job. Nightly is isolated in api-gates below.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install the BCF test oracle
        run: sudo apt-get update && sudo apt-get install -y bcftools
      - name: formatting
        run: cargo fmt --all --check
      - name: build (release, all targets)
        run: cargo build --release --locked --workspace --all-targets
      - name: test (debug)
        env:
          # One Lanczos unit fixture exceeds the default 2 MiB test-thread stack on MSRV.
          RUST_MIN_STACK: 8388608
        run: cargo test --locked --workspace
      - name: test (release)
        run: cargo test --release --locked --workspace
      - name: doctests (facade)
        run: cargo test --locked --doc -p reed
      - name: clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      # Empty feature sets must build: reed-reduce used to fail here.
      - name: feature matrix (no default features)
        run: cargo check --locked -p reed-reduce --no-default-features
      - name: doc-drift guards
        run: bash ci/check-doc-drift.sh
      - name: structure guards
        run: bash ci/check-structure.sh
      - name: Install cargo-hack, cargo-semver-checks, cargo-modules
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.46,cargo-semver-checks@0.51.0,cargo-modules@0.28.0
      - name: nameability guards
        run: bash ci/check-nameable.sh
      - name: documentation guards
        run: bash ci/check-docs.sh
      - name: feature matrix (each feature)
        run: bash ci/check-features.sh
      - name: semver guards
        run: bash ci/check-semver.sh
      - name: package guards
        run: bash ci/check-package.sh

  api-gates:
    # These tools require nightly rustdoc JSON. Keep the pinned nightly out of
    # the ordinary stable gates so it cannot become their default compiler.
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-03-20
      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: public API snapshot
        run: bash ci/check-api.sh
      - name: Install cargo-check-external-types
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-check-external-types@0.5.0
      - name: external types
        run: bash ci/check-external-types.sh

  msrv:
    # Main checks only source/library targets; development branches retain the
    # broader all-targets MSRV check, including tests and benches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91.1"
      - name: Check public source on the minimum supported Rust version
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: cargo check --locked --workspace
      - name: Check all development targets on the minimum supported Rust version
        if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
        run: cargo check --locked --workspace --all-targets

  data-gates:
    # Data and gold fixtures are development-only and must never run on main.
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main' && contains(github.event.pull_request.labels.*.name, 'run-data-gates')
    runs-on: [self-hosted, reed-data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91.1"
      - name: Build the checkout used by every data gate
        run: |
          cargo build --release --locked -p reed-cli --target-dir target
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: subset numeric gates (263,420 / 381,672)
        run: |
          export REED_SCRATCH=target/gold
          bash gold/scripts/make_subset.sh Chr01,Chr02,Chr03 "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz"
          reed filter "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz" \
            --min-dp 5 --min-gq 20 --geno 0.1 -Oz -o "$REED_SCRATCH/out/gate_0.1.vcf.gz"
          n1=$(bcftools view -H "$REED_SCRATCH/out/gate_0.1.vcf.gz" | wc -l)
          test "$n1" -eq 263420
      - name: gold parity
        run: |
          export REED_SCRATCH=target/gold
          # Use the binary built above so parity is checked against this commit.
          export REED="$PWD/target/release/reed"
          bash gold/scripts/run_all.sh
          test -s "$REED_SCRATCH/out/reed.vcf.gz"
          python3 gold/scripts/check_parity.py "$REED_SCRATCH/out/reed.vcf.gz" \
            --gold "$REED_SCRATCH/out/gold.vcf.gz"
