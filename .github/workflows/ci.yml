# CI (docs/rounds/v5/07-roadmap.md X7): the portable gates run on every push
# and pull request. The data-dependent gates (the subset numeric gates
# 263,420 / 381,672 and the gold parity run) need the 7 GB input and the
# reference tools, so they run only on a runner with the data checkout
# (self-hosted label `reed-data`).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The clippy gate below needs the component; the toolchain file
          # alone does not install it (every run failed on
          # "'cargo-clippy' is not installed for the toolchain '1.99'").
          components: clippy
      # Compiling the workspace is the first gate (doc_v5 A5-4: the trunk
      # must never sit in a "tests do not compile" state).
      - name: build (release, all targets)
        run: cargo build --release --workspace --all-targets
      # Debug first: `debug_assert!` is compiled out of the release run below,
      # so a red assertion test is invisible there (doc_v9 D9-8: the stitcher
      # test survived two rounds because only release ran).
      - name: test (debug)
        run: cargo test --workspace
      - name: test (release)
        run: cargo test --release --workspace
      - name: doctests (facade)
        run: cargo test --doc -p reed
      - name: clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: doc-drift guards
        run: bash ci/check-doc-drift.sh

  # doc_v26 V26-11: the manifest claims MSRV 1.91 but every other job used the
  # pinned 1.99 toolchain, so a dependency update could raise the real floor
  # while CI stayed green. This job proves the claim on the declared version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91"
      - name: cargo check on the declared MSRV (1.91)
        run: cargo check --workspace --all-targets

  data-gates:
    # The subset numeric gates and the gold parity run need clean.vcf.gz and
    # the reference tools; only a runner with the data can execute them.
    if: contains(github.event.pull_request.labels.*.name, 'run-data-gates')
    runs-on: [self-hosted, reed-data]
    steps:
      - uses: actions/checkout@v4
      - name: subset numeric gates (263,420 / 381,672)
        run: |
          export REED_SCRATCH=target/gold
          bash gold/scripts/make_subset.sh Chr01,Chr02,Chr03 "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz"
          reed filter "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz" \
            --min-dp 5 --min-gq 20 --geno 0.1 -Oz -o "$REED_SCRATCH/out/gate_0.1.vcf.gz"
          n1=$(bcftools view -H "$REED_SCRATCH/out/gate_0.1.vcf.gz" | wc -l)
          test "$n1" -eq 263420
      - name: gold parity
        run: |
          export REED_SCRATCH=target/gold
          # doc_v26 V26-14: the parity step used to read out/reed.vcf.gz
          # without ever producing it, so it compared whatever a previous
          # self-hosted run had left behind. Build this checkout's binary and
          # export REED: `run_all.sh` joins the reed branch (see
          # review item 6 -- the explicit `run_reed.sh` after it ran the same
          # large computation twice), so the parity input is provably from the
          # commit under test.
          cargo build --release -p reed-cli
          export REED="$PWD/target/release/reed"
          bash gold/scripts/run_all.sh
          test -s "$REED_SCRATCH/out/reed.vcf.gz"
          python3 gold/scripts/check_parity.py "$REED_SCRATCH/out/reed.vcf.gz" \
            --gold "$REED_SCRATCH/out/gold.vcf.gz"
