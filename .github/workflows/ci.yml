# Development branches keep the full gates; main checks the public source build.
# For pull requests, use the target branch to select the checks. Release tags
# are handled by release.yml, since the public tree omits development fixtures.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build public source (release)
        run: cargo build --release --locked --workspace

  gates:
    if: (github.base_ref || github.ref_name) != 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Install the BCF test oracle
        run: sudo apt-get update && sudo apt-get install -y bcftools
      # Compiling the workspace is the first gate (doc_v5 A5-4: the trunk
      # must never sit in a "tests do not compile" state).
      - name: build (release, all targets)
        run: cargo build --release --locked --workspace --all-targets
      # Debug first: `debug_assert!` is compiled out of the release run below,
      # so a red assertion test is invisible there (doc_v9 D9-8: the stitcher
      # test survived two rounds because only release ran).
      - name: test (debug)
        env:
          # One Lanczos unit fixture exceeds the default 2 MiB test-thread stack on MSRV.
          RUST_MIN_STACK: 8388608
        run: cargo test --locked --workspace
      - name: test (release)
        run: cargo test --release --locked --workspace
      - name: doctests (facade)
        run: cargo test --locked --doc -p reed
      - name: clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - name: doc-drift guards
        run: bash ci/check-doc-drift.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91.1"
      - name: Check public source on the minimum supported Rust version
        if: (github.base_ref || github.ref_name) == 'main'
        run: cargo check --locked --workspace
      - name: Check all development targets on the minimum supported Rust version
        if: (github.base_ref || github.ref_name) != 'main'
        run: cargo check --locked --workspace --all-targets

  data-gates:
    # The subset numeric gates and the gold parity run need clean.vcf.gz and
    # the reference tools; only a runner with the data can execute them.
    if: (github.base_ref || github.ref_name) != 'main' && contains(github.event.pull_request.labels.*.name, 'run-data-gates')
    runs-on: [self-hosted, reed-data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91.1"
      - name: Build the checkout used by every data gate
        run: |
          cargo build --release --locked -p reed-cli --target-dir target
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: subset numeric gates (263,420 / 381,672)
        run: |
          export REED_SCRATCH=target/gold
          bash gold/scripts/make_subset.sh Chr01,Chr02,Chr03 "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz"
          reed filter "$REED_SCRATCH/work/subset.Chr01-03.vcf.gz" \
            --min-dp 5 --min-gq 20 --geno 0.1 -Oz -o "$REED_SCRATCH/out/gate_0.1.vcf.gz"
          n1=$(bcftools view -H "$REED_SCRATCH/out/gate_0.1.vcf.gz" | wc -l)
          test "$n1" -eq 263420
      - name: gold parity
        run: |
          export REED_SCRATCH=target/gold
          # doc_v26 V26-14: the parity step used to read out/reed.vcf.gz
          # without ever producing it, so it compared whatever a previous
          # self-hosted run had left behind. Use the binary built above and
          # export REED: `run_all.sh` joins the reed branch (see
          # review item 6 -- the explicit `run_reed.sh` after it ran the same
          # large computation twice), so the parity input is provably from the
          # commit under test.
          export REED="$PWD/target/release/reed"
          bash gold/scripts/run_all.sh
          test -s "$REED_SCRATCH/out/reed.vcf.gz"
          python3 gold/scripts/check_parity.py "$REED_SCRATCH/out/reed.vcf.gz" \
            --gold "$REED_SCRATCH/out/gold.vcf.gz"
