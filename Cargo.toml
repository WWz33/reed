[workspace]
resolver = "3"
members = ["crates/*"]
# The graphify tool writes its analysis output under crates/ when run from
# the workspace root; it is a tool artefact (see .gitignore) and must not be
# treated as a workspace member.
exclude = ["crates/graphify-out"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates (L0..L5), lockstep versioned.
reed-core = { path = "crates/reed-core", version = "0.4.0" }
reed-io = { path = "crates/reed-io", version = "0.4.0" }
reed-engine = { path = "crates/reed-engine", version = "0.4.0" }
reed-stats = { path = "crates/reed-stats", version = "0.4.0" }
reed-filter = { path = "crates/reed-filter", version = "0.4.0" }
reed-graph = { path = "crates/reed-graph" }
reed = { path = "crates/reed", version = "0.4.0" }

# Transport / engine.
noodles = { version = "0.117", features = ["bcf", "bgzf", "core", "csi", "tabix", "vcf"] }
libdeflater = "1"
memchr = "2"
flate2 = "1"
memmap2 = "0.9"
crossbeam-channel = "0.5"
rayon = "1"
smallvec = "1"
bitflags = "2"

# Errors, data formats, observability.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ryu = "1"
tracing = "0.1"

# CLI only.
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mimalloc = "0.1"
anyhow = "1"

# Dev / benches.
bstr = "1"
proptest = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
# Audited (doc_v3 04 §C7): every `expect()` in production code carries an
# `invariant: …` message (internal invariant, not an input condition) and
# input-related conditions return errors instead; test code is covered by
# clippy.toml's allow-*-in-tests.
expect_used = "allow"
panic = "warn"
cast_possible_truncation = "warn"
# C7 policy (doc_v3 04 §C7): truncation is handled case by case (real risks
# fixed, the rest carry a documented file-level allow); these three are
# lossless/precision-only conversions whose ranges are structural
# (bit-plane popcounts to u64, allele counts to f64).
# Style/documentation classes (doc_v3 04 §C7): exempted so the warning
# stream keeps the perf/correctness hints (format_push_string,
# naive_bytecount, float_cmp) visible.
doc_markdown = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
single_match_else = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
needless_for_each = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
implicit_clone = "allow"
unused_self = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnested_or_patterns = "allow"
redundant_closure_for_method_calls = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
