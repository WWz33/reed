[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates (L0..L5), lockstep versioned.
reed-core = { path = "crates/reed-core", version = "0.3.0" }
reed-io = { path = "crates/reed-io", version = "0.3.0" }
reed-engine = { path = "crates/reed-engine", version = "0.3.0" }
reed-stats = { path = "crates/reed-stats", version = "0.3.0" }
reed-qc = { path = "crates/reed-qc", version = "0.3.0" }
reed-filter = { path = "crates/reed-filter", version = "0.3.0" }
reed = { path = "crates/reed", version = "0.3.0" }

# Transport / engine.
noodles = { version = "0.117", features = ["bcf", "bgzf", "core", "csi", "tabix", "vcf"] }
libdeflater = "1"
memchr = "2"
flate2 = "1"
memmap2 = "0.9"
crossbeam-channel = "0.5"
rayon = "1"
smallvec = "1"
bitflags = "2"

# Errors, data formats, observability.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ryu = "1"
tracing = "0.1"

# CLI only.
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mimalloc = "0.1"
anyhow = "1"

# Dev / benches.
proptest = "1"
criterion = "0.5"
assert_cmd = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
